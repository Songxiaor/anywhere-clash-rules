name: Sync Clash YAML

on:
  push:
    branches: [main]
    paths:
      - "anywhere/**"
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/convert.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert Anywhere rules to Clash YAML
        run: python3 scripts/convert.py

      - name: Fail if generated files drifted
        if: github.event_name == 'pull_request'
        run: git diff --exit-code

      - name: Commit generated files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash catalog.json README.md
          if git diff --cached --quiet; then
            echo "already in sync"
          else
            git commit -m "chore: regenerate Clash YAML from Anywhere rules"
            git push
          fi
